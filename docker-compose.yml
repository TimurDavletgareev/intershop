version: '3.8'

services:

  main-service:
    build: ./main-service
    container_name: intershop_react_container
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - payment-service
    environment:
      - INTERSHOP_PAYMENT_URL=http://payment-service:9090
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TTL=PT5S
      - KEYCLOAK_ISSUER_URI=http://host.docker.internal:8085/realms/master
      - KEYCLOAK_CLIENT_SECRET=RZuHHge8P2E04ctFRntjOvBY3JolrWdy
    links:
      - redis

  payment-service:
    build: ./payment-service
    container_name: intershop_payment_container
    ports:
      - "9090:9090"
    environment:
      - JWT_ISSUER_URI=http://host.docker.internal:8085/realms/master

  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keycloak-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
    command:
      - start-dev
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak-network

volumes:
  postgres_data:
    name: keycloak_postgres_data

networks:
  keycloak-network:
    name: keycloak-network