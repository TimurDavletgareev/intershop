spring.application.name=intershop

server.port=8080

spring.sql.init.mode=always

spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=50
spring.r2dbc.pool.max-idle-time=30s
spring.r2dbc.pool.max-life-time=10m
spring.r2dbc.pool.validation-query=SELECT 1

logging.level.ru.yandex.practicum=DEBUG
logging.level.org.springframework.web=DEBUG

#redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
# TTL по умолчанию для кешей
spring.cache.redis.time-to-live=${REDIS_TTL}

#intershop-payment-server
intershop-payment.url=${INTERSHOP_PAYMENT_URL}
